name: Remove History AI page

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-history-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove History AI page and references
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # 1) Remove the dedicated History AI CSS block. Use marker positions
          # instead of relying on the exact decorative Unicode divider length.
          marker = 'HISTORY AI — INTERACTIVE TIME MACHINE'
          pos = s.find(marker)
          if pos == -1:
              raise SystemExit('History AI CSS marker not found.')
          css_start = s.rfind('/*', 0, pos)
          if css_start == -1:
              raise SystemExit('History AI CSS block start not found.')
          home_pos = s.find('HOME PAGE', pos)
          if home_pos == -1:
              raise SystemExit('HOME PAGE CSS marker not found after History AI CSS.')
          css_end = s.rfind('/*', pos, home_pos + 1)
          if css_end <= css_start:
              raise SystemExit('Could not determine History AI CSS block end.')
          s = s[:css_start] + s[css_end:]

          # 2) Remove the complete History AI page. The Geography page follows it.
          marker = 'HISTORY AI PAGE — INTERACTIVE TIME MACHINE'
          pos = s.find(marker)
          if pos == -1:
              raise SystemExit('History AI page marker not found.')
          page_start = s.rfind('<!--', 0, pos)
          geography_start = s.find('<div id="page-geography" class="page">', pos)
          if page_start == -1 or geography_start == -1:
              raise SystemExit('Could not determine History AI page boundaries.')
          s = s[:page_start] + s[geography_start:]

          # 3) Remove History AI links from all standard navigation bars.
          nav_pattern = re.compile(
              r'\s*<li><a onclick="navigate\(\'historyai\'\)" class="nav-history-ai-link">History AI<span class="nav-ai-dot"></span></a></li>'
          )
          s, nav_n = nav_pattern.subn('', s)
          if nav_n < 1:
              raise SystemExit('No History AI top-navigation links were found.')

          # 4) Remove the dedicated sidebar History AI item.
          sidebar_pattern = re.compile(
              r'\s*<li>\s*<a data-page="historyai" class="snav-ranai" onclick="navigate\(\'historyai\'\); closeSidebar\(\);">.*?</a>\s*</li>',
              re.S,
          )
          s, sidebar_n = sidebar_pattern.subn('', s)
          if sidebar_n != 1:
              raise SystemExit(f'Expected 1 History AI sidebar item, found {sidebar_n}.')

          # 5) Remove the History AI initialization hook.
          init_pattern = re.compile(
              r'\s*if \(page === \'historyai\' && typeof haiInit === \'function\'\) haiInit\(\);'
          )
          s, init_n = init_pattern.subn('', s)
          if init_n != 1:
              raise SystemExit(f'Expected 1 History AI init hook, found {init_n}.')

          # 6) Remove the History AI page label from navigation search labels.
          s, labels_n = re.subn(r'\s*historyai: \'History AI\',', '', s, count=1)
          if labels_n != 1:
              raise SystemExit(f'Expected 1 History AI nav label, found {labels_n}.')

          # 7) Remove the History AI entry from the navigation search index.
          extra_pattern = re.compile(
              r'\s*\{\s*page: \'historyai\', elementId: null, title: \'History AI\',.*?\n\s*\},\s*(?=\n\s*\{\s*page: \'ranai\')',
              re.S,
          )
          s, extra_n = extra_pattern.subn('', s, count=1)
          if extra_n != 1:
              raise SystemExit(f'Expected 1 History AI search-index entry, found {extra_n}.')

          # 8) Remove the History AI JavaScript block at the end of the main script.
          marker = 'HISTORY AI — ROBUST FRONTEND MODE'
          pos = s.find(marker)
          if pos == -1:
              raise SystemExit('History AI JS marker not found.')
          js_start = s.rfind('/*', 0, pos)
          script_end = s.find('</script>', pos)
          if js_start == -1 or script_end == -1:
              raise SystemExit('Could not determine History AI JS block boundaries.')
          s = s[:js_start] + s[script_end:]

          # 9) Remove the obsolete History AI navigation CSS class if still unused.
          s = re.sub(r'\.nav-history-ai-link\{[^}]*\}', '', s)
          s = re.sub(r'\.nav-history-ai-link\s*\{[^}]*\}', '', s)

          # 10) Safety check: no active page or navigation entry remains.
          forbidden = [
              'id="page-historyai"',
              "navigate('historyai')",
              'data-page="historyai"',
              "historyai: 'History AI'",
              'HISTORY AI — INTERACTIVE TIME MACHINE',
              'HISTORY AI — ROBUST FRONTEND MODE',
          ]
          leftovers = [item for item in forbidden if item in s]
          if leftovers:
              raise SystemExit('History AI references still remain: ' + ', '.join(leftovers))

          p.write_text(s, encoding='utf-8')
          print(f'Removed History AI page: {nav_n} nav links, {sidebar_n} sidebar item, {init_n} init hook.')

      - name: Commit changes and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-history-ai.yml
          git commit -m "Remove History AI page"
          git push
